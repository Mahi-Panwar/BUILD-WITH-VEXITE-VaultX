<div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3"></div>

<div id="app" class="w-full min-h-screen flex flex-col flex-1">

<script>
let state = {
  user: null,           
  sessionPin: null,
  authTab: 'landing',      
  dashTab: 'dashboard'
};

async function apiCall(endpoint, payload) {
  try {
    const url = endpoint.startsWith('http') ? endpoint : 'http://127.0.0.1:8000' + endpoint;
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    return await res.json();
  } catch (err) {
    return { ok: false, msg: 'Network error or server down.' };
  }
}

async function refreshUser() {
  if (!state.user) return;
  const accNo = state.user.accountNo || state.user['accountNo.'];
  const res = await apiCall('/api/login', { accountNo: accNo, pin: String(state.sessionPin) });
  if (res.ok) state.user = res.user;
}

function showToast(msg, isSuccess) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast-enter flex items-center gap-3 px-5 py-4 rounded-xl shadow-2xl text-slate-200 ${isSuccess ? 'bg-amber-500 text-walnut' : 'bg-rose-600'}`;
  toast.innerHTML = `<i class="fas ${isSuccess ? 'fa-check-circle text-xl' : 'fa-exclamation-circle text-xl'}"></i> <span class="font-medium">${msg}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(20px)';
    toast.style.transition = 'all 0.3s ease';
    setTimeout(() => toast.remove(), 300);
  }, 4000);
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  const app = document.getElementById('app');
  if (state.user) {
    app.innerHTML = dashboardLayoutHTML(state.user);
  } else if (state.authTab === 'landing') {
    app.innerHTML = landingPageHTML();
  } else {
    app.innerHTML = authLayoutHTML();
  }
  wireEvents();
}

            <p class="text-sm text-slate-100/70 mt-2">You currently do not have any active loans linked to this account.</p>
          </div>
        </div>
      </div>
    `;
  }

  if (state.dashTab === 'settings') {
    return `
      <div class="fade-in max-w-4xl mx-auto space-y-8">
        <div class="bg-[#181b21] rounded-3xl shadow-md border border-white/10 overflow-hidden">
          <div class="bg-[#181b21]/5 p-6 border-b border-white/10">
            <h3 class="text-xl font-bold text-slate-100 flex items-center gap-2"><i class="fas fa-user-edit text-amber-500"></i> Modify Account Information</h3>
          </div>
          <div class="p-8">
            <form id="updateForm" class="space-y-6">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                  <label class="block text-sm font-bold text-slate-200/70 mb-2">Full Name</label>
                  <input type="text" id="up_name" placeholder="${esc(user.name)}" class="w-full px-5 py-3.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500 outline-none transition-shadow bg-black/20 focus:bg-black/40 text-slate-200 placeholder-slate-400">
                </div>
                <div>
                  <label class="block text-sm font-bold text-slate-200/70 mb-2">Email Address</label>
                  <input type="email" id="up_email" placeholder="${esc(user.email)}" class="w-full px-5 py-3.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500 outline-none transition-shadow bg-black/20 focus:bg-black/40 text-slate-200 placeholder-slate-400">
                </div>
              </div>
              <div class="max-w-xs">
                <label class="block text-sm font-bold text-slate-200/70 mb-2">New 4-Digit PIN</label>
                <input type="password" id="up_pin" maxlength="4" placeholder="••••" class="w-full px-5 py-3.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500 outline-none transition-shadow bg-black/20 focus:bg-black/40 text-slate-200 placeholder-slate-400 text-xl tracking-widest font-mono">
                <p class="text-xs text-slate-100/70 mt-2">Leave blank to keep current PIN.</p>
              </div>
              <div class="pt-4">
                <button type="submit" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-200 font-medium py-3 px-8 rounded-xl transition-all shadow-md shadow-brass/20">
                  Save Changes
                </button>
              </div>
            </form>
          </div>
        </div>

        <div class="bg-[#181b21] rounded-3xl shadow-md border border-rose-200 overflow-hidden">
          <div class="bg-rose-500/10 p-6 border-b border-rose-200">
            <h3 class="text-xl font-bold text-rose-800 flex items-center gap-2"><i class="fas fa-exclamation-triangle text-rose-600"></i> Terminate Account</h3>
          </div>
          <div class="p-8 flex flex-col md:flex-row items-center justify-between gap-6">
            <div>
              <p class="text-slate-100 font-medium mb-1">Permanently delete your VaultX profile.</p>
              <p class="text-sm text-slate-100/70 max-w-lg">Once you delete your account, all your records, including your balance ledger, will be permanently erased. This action cannot be undone.</p>
            </div>
            <button id="deleteBtn" class="shrink-0 bg-[#181b21] border-2 border-rose-600 text-rose-600 hover:bg-rose-600 hover:text-slate-200 font-bold py-3 px-6 rounded-xl transition-all flex items-center gap-2">
              <i class="fas fa-trash-alt"></i> Delete Account
            </button>
          </div>
        </div>
      </div>
    `;
  }
}

function wireEvents(){
  const user = state.user;
  
  // Navigation for both states
  document.querySelectorAll('[data-tab]').forEach(btn => {
    btn.onclick = (e) => { 
      e.preventDefault();
      state.authTab = btn.dataset.tab; 
      render(); 
    };
  });

  // Auth Events
  if (!user){
    const loginForm = document.getElementById('loginForm');
    if (loginForm) loginForm.onsubmit = async e => {
      e.preventDefault();
      const btn = loginForm.querySelector('button');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin text-xl"></i>';
      
      const acc = document.getElementById('li_acc').value.trim();
      const pinRaw = document.getElementById('li_pin').value.trim();
      
      if (!acc || !pinRaw){ 
        showToast("Enter both Email/Account No and PIN.", false);
        btn.innerHTML = originalText;
        return;
      }
      
      const res = await apiCall('/api/login', { accountNo: acc, pin: pinRaw });
      if (res.ok){
        state.user = res.user;
        state.sessionPin = String(pinRaw);
        state.dashTab = 'dashboard';
        showToast("Authentication Successful.", true);
      } else {
        showToast(res.msg, false);
        btn.innerHTML = originalText;
      }
      render();
    };

    const createForm = document.getElementById('createForm');
    if (createForm) createForm.onsubmit = async e => {
      e.preventDefault();
      const btn = createForm.querySelector('button');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin text-xl"></i>';

      const name = document.getElementById('cr_name').value;
      const age = Number(document.getElementById('cr_age').value);
      const email = document.getElementById('cr_email').value;
      const pin = document.getElementById('cr_pin').value;
      
      const res = await apiCall('/api/create', { name, age, email, pin });
      if (res.ok){
        showToast("Account Created successfully!", true);
        state.user = res.user;
        state.sessionPin = String(pin);
        state.dashTab = 'dashboard';
      } else {
        showToast(res.msg, false);
        btn.innerHTML = originalText;
      }
      render();
    };
    return;
  }

  // Dashboard Events
  const logoutBtn = document.getElementById('logoutLink');
  const mobileLogoutBtn = document.getElementById('mobileLogout');
  
  const doLogout = () => {
    state.user = null; state.sessionPin = null; state.authTab = 'landing';
    showToast("Logged out securely.", true);
    render();
  };
  
  if (logoutBtn) logoutBtn.onclick = doLogout;
  if (mobileLogoutBtn) mobileLogoutBtn.onclick = doLogout;

  document.querySelectorAll('[data-dtab]').forEach(btn => {
    btn.onclick = () => { state.dashTab = btn.dataset.dtab; render(); };
  });

  const depositForm = document.getElementById('depositForm');
  if (depositForm) depositForm.onsubmit = async e => {
    e.preventDefault();
    const btn = depositForm.querySelector('button');
    const oldHtml = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin text-xl"></i>';

    const amt = Number(document.getElementById('dep_amt').value);
    const res = await apiCall('/api/deposit', { accountNo: user.accountNo || user['accountNo.'], pin: state.sessionPin, amount: amt });
    if (res.ok) {
      showToast(`Successfully deposited ₹${amt.toLocaleString()}`, true);
      await refreshUser();
      state.dashTab = 'dashboard';
    } else {
      showToast(res.msg, false);
      btn.innerHTML = oldHtml;
    }
    render();
  };

  const withdrawForm = document.getElementById('withdrawForm');
  if (withdrawForm) withdrawForm.onsubmit = async e => {
    e.preventDefault();
    const btn = withdrawForm.querySelector('button');
    const oldHtml = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin text-xl"></i>';

    const amt = Number(document.getElementById('wd_amt').value);
    const res = await apiCall('/api/withdraw', { accountNo: user.accountNo || user['accountNo.'], pin: state.sessionPin, amount: amt });
    if (res.ok) {
      showToast(`Successfully withdrew ₹${amt.toLocaleString()}`, true);
      await refreshUser();
      state.dashTab = 'dashboard';
    } else {
      showToast(res.msg, false);
      btn.innerHTML = oldHtml;
    }
    render();
  };


  const transferForm = document.getElementById('transferForm');
  if (transferForm) transferForm.onsubmit = async e => {
    e.preventDefault();
    const btn = transferForm.querySelector('button');
    const oldHtml = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin text-xl"></i>';

    const target = document.getElementById('tr_target').value;
    const amt = Number(document.getElementById('tr_amt').value);
    const res = await apiCall('/api/transfer', { accountNo: user.accountNo || user['accountNo.'], pin: state.sessionPin, targetAccount: target, amount: amt });
    if (res.ok) {
      showToast(`Successfully transferred ₹${amt.toLocaleString()}`, true);
      await refreshUser();
      state.dashTab = 'dashboard';
    } else {
      showToast(res.msg, false);
      btn.innerHTML = oldHtml;
    }
    render();
  };

  const updateForm = document.getElementById('updateForm');
  if (updateForm) updateForm.onsubmit = async e => {
    e.preventDefault();
    const btn = updateForm.querySelector('button');
    const oldHtml = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin text-xl"></i>';

    const name = document.getElementById('up_name').value;
    const email = document.getElementById('up_email').value;
    const pin = document.getElementById('up_pin').value;
    const res = await apiCall('/api/update', { accountNo: user.accountNo || user['accountNo.'], pin: state.sessionPin, name: name||null, email: email||null, newPin: pin||null });
    
    if (res.ok) {
        state.sessionPin = String(res.newPin);
        await refreshUser();
        showToast("Account holder details updated successfully.", true);
    } else {
        showToast(res.msg, false);
    }
    btn.innerHTML = oldHtml;
    render();
  };

  const deleteBtn = document.getElementById('deleteBtn');
  if (deleteBtn) deleteBtn.onclick = async () => {
    if (confirm("Are you entirely sure you want to delete your account? This action is irreversible.")) {
      const btnOldHtml = deleteBtn.innerHTML;
      deleteBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
      const res = await apiCall('/api/delete', { accountNo: user.accountNo || user['accountNo.'], pin: state.sessionPin });
      if (res.ok){
        state.user = null; state.sessionPin = null; state.authTab = 'landing';
        showToast("Account successfully deleted from the database records.", true);
      } else {
        showToast(res.msg, false);
        deleteBtn.innerHTML = btnOldHtml;
      }
      render();
    }
  };
}

// Initial render
render();
</script>

<!-- Chatbot Widget -->
<div id="chat-widget" class="fixed bottom-6 right-6 z-[100] flex flex-col items-end">
  
  <!-- Chat Window -->
  <div id="chat-window" class="hidden w-80 sm:w-96 bg-[#0f172a]/90 backdrop-blur-2xl border-white/10 rounded-2xl shadow-2xl border border-white/10 mb-4 overflow-hidden flex-col h-[500px] max-h-[80vh] fade-in">
    <!-- Header -->
    <div class="bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-200 p-4 flex justify-between items-center shrink-0">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full bg-gradient-to-r from-cyan-500 to-blue-600 flex items-center justify-center">
          <i class="fas fa-robot text-sm"></i>
        </div>
        <div>
          <h4 class="font-bold text-sm">VaultX Assistant</h4>
          <p class="text-[10px] text-slate-200/70">Powered by Gemini AI</p>
        </div>
      </div>
      <button onclick="toggleChat()" class="text-slate-100/70 hover:text-slate-200 transition-colors">
        <i class="fas fa-times"></i>
      </button>
    </div>
    
    <!-- Messages Area -->
    <div id="chat-messages" class="flex-1 p-4 overflow-y-auto bg-transparent flex flex-col gap-3 text-sm">
      <div class="flex justify-start">
        <div class="bg-[#181b21] border border-slate-700 text-emerald-500 font-handwriting text-2xl font-bold p-3 rounded-2xl rounded-tl-sm shadow-sm max-w-[85%] leading-relaxed">Hello! I am your VaultX AI Assistant. How can I help you today?</div>
      </div>
    </div>
    
    <!-- Input Area -->
    <div class="p-3 bg-[#181b21] border-t border-white/5 shrink-0">
      <form id="chat-form" class="relative flex items-center">
        <input type="text" id="chat-input" autocomplete="off" placeholder="Ask something..." required class="w-full pl-4 pr-12 py-3 rounded-xl border border-white/10 bg-black/20 focus:bg-black/40 text-slate-200 placeholder-slate-400 focus:ring-2 focus:ring-amber-500 focus:border-brass outline-none transition-all">
        <button type="submit" class="absolute right-2 w-8 h-8 bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-200 rounded-lg flex items-center justify-center hover:from-cyan-400 hover:to-blue-500 transition-colors shadow-sm">
          <i class="fas fa-paper-plane text-xs"></i>
        </button>
      </form>
    </div>
  </div>
  
  <!-- Floating Toggle Button -->
  <button id="chat-toggle" onclick="toggleChat()" class="w-14 h-14 bg-[#0f1115] hover:bg-[#0f1115] text-slate-200 rounded-full flex items-center justify-center shadow-2xl transition-transform hover:scale-110 active:scale-95 group">
    <i class="fas fa-comment-dots text-2xl group-hover:hidden"></i>
    <i class="fas fa-robot text-2xl hidden group-hover:block"></i>
  </button>
</div>

<script>
  function toggleChat() {
    const window = document.getElementById('chat-window');
    if (window.classList.contains('hidden')) {
      window.classList.remove('hidden');
      window.classList.add('flex');
    } else {
      window.classList.add('hidden');
      window.classList.remove('flex');
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    // We bind the chat form on next tick to ensure elements exist
    setTimeout(() => {
      const chatForm = document.getElementById('chat-form');
      if (chatForm) {
        chatForm.onsubmit = async (e) => {
          e.preventDefault();
          const input = document.getElementById('chat-input');
          const msg = input.value.trim();
          if (!msg) return;
          
          input.value = '';
          const messagesArea = document.getElementById('chat-messages');
          
          // Add User Message
          messagesArea.innerHTML += `
            <div class="flex justify-end">
              <div class="bg-navy text-slate-200 p-3 rounded-2xl rounded-tr-sm shadow-sm max-w-[85%] leading-relaxed font-sans">
                ${msg.replace(/</g, "&lt;").replace(/>/g, "&gt;")}
              </div>
            </div>
          `;
          messagesArea.scrollTop = messagesArea.scrollHeight;
          
          // Add Loading Indicator
          const loadId = 'loading-' + Date.now();
          messagesArea.innerHTML += `
            <div id="${loadId}" class="flex justify-start">
              <div class="bg-[#181b21] border border-white/10 text-slate-100/70 p-3 rounded-2xl rounded-tl-sm shadow-sm flex items-center gap-2">
                <i class="fas fa-circle-notch fa-spin"></i> Thinking...
              </div>
            </div>
          `;
          messagesArea.scrollTop = messagesArea.scrollHeight;
          
          try {
            const url = 'http://127.0.0.1:8000/api/chat';
            const res = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: msg })
            });
            const data = await res.json();
            
            document.getElementById(loadId).remove();
            
            // Add Bot Message
            messagesArea.innerHTML += `
              <div class="flex justify-start">
                <div class="bg-[#181b21] border border-slate-700 text-emerald-500 font-handwriting text-2xl font-bold p-3 rounded-2xl rounded-tl-sm shadow-sm max-w-[85%] leading-relaxed whitespace-pre-wrap">
                  ${data.reply ? data.reply.replace(/</g, "&lt;").replace(/>/g, "&gt;") : "Error connecting to AI."}
                </div>
              </div>
            `;
          } catch(err) {
            document.getElementById(loadId).remove();
            messagesArea.innerHTML += `
              <div class="flex justify-start">
                <div class="bg-rose-500/10 border border-rose-200 text-rose-700 p-3 rounded-2xl rounded-tl-sm shadow-sm max-w-[85%] leading-relaxed">
                  Network error.
                </div>
              </div>
            `;
          }
          messagesArea.scrollTop = messagesArea.scrollHeight;
        };
      }
    }, 100);
  });
</script>

</body>
