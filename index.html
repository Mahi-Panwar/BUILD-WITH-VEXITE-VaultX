<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaultX - Python OOP Bank Management System</title>
  
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            vault: {
              950: '#070412',
              900: '#0C0721',
              850: '#120A30',
              800: '#180E3D',
              700: '#231454',
              600: '#341C7A',
              accent: '#8B5CF6',
              glow: '#A855F7',
              neon: '#C084FC',
              cyan: '#06B6D4',
              gold: '#FBBF24',
              emerald: '#10B981',
              rose: '#F43F5E'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"Fira Code"', 'monospace'],
            handwriting: ['"Caveat"', 'cursive']
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #070412;
      color: #E2E8F0;
      overflow-x: hidden;
    }

    /* Ambient Lighting */
    .glow-purple {
      background: radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.18), transparent 70%);
    }
    .glow-cyan {
      background: radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.15), transparent 70%);
    }

    /* Glass Surfaces */
    .glass-card {
      background: linear-gradient(135deg, rgba(24, 14, 61, 0.8) 0%, rgba(12, 7, 33, 0.9) 100%);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(168, 85, 247, 0.2);
    }
    .glass-card-hover:hover {
      border-color: rgba(168, 85, 247, 0.45);
      transform: translateY(-2px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Bank Card Visual */
    .bank-card-gradient {
      background: linear-gradient(135deg, #2D1460 0%, #170B36 50%, #0A051A 100%);
      border: 1px solid rgba(192, 132, 252, 0.35);
      box-shadow: 0 15px 35px -5px rgba(139, 92, 246, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.25);
    }

    /* Toast Animation */
    .toast-anim {
      animation: toastSlideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes toastSlideIn {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* IDE Terminal View */
    .ide-window {
      background: #0E0822;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(139, 92, 246, 0.15);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #070412; }
    ::-webkit-scrollbar-thumb { background: #231454; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #8B5CF6; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-purple-600 selection:text-white">

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-[130] flex flex-col gap-3 pointer-events-none"></div>

  <!-- Global Modal Container (For Quick Balance Check & Account Created Notification) -->
  <div id="modal-container" class="fixed inset-0 z-[110] hidden items-center justify-center p-4 bg-black/75 backdrop-blur-md"></div>

  <!-- Dynamic Application Root -->
  <div id="app" class="w-full min-h-screen flex flex-col flex-1"></div>

  <script>
    let state = {
      user: null,
      sessionPin: null,
      authTab: 'landing', // 'landing' | 'login' | 'create'
      dashTab: 'dashboard' // 'dashboard' | 'deposit' | 'withdraw' | 'transfer' | 'balance' | 'history' | 'cards' | 'settings'
    };

    // Modern Vector Brand Logo SVG
    function getVaultXLogo(size = "w-8 h-8") {
      return `
        <svg class="${size} shrink-0" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="vaultGrad" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
              <stop stop-color="#C084FC"/>
              <stop offset="0.5" stop-color="#8B5CF6"/>
              <stop offset="1" stop-color="#4F46E5"/>
            </linearGradient>
            <linearGradient id="vaultDial" x1="8" y1="8" x2="24" y2="24" gradientUnits="userSpaceOnUse">
              <stop stop-color="#38BDF8"/>
              <stop offset="1" stop-color="#818CF8"/>
            </linearGradient>
          </defs>
          <path d="M16 2.5L28 9V23L16 29.5L4 23V9L16 2.5Z" stroke="url(#vaultGrad)" stroke-width="2.2" stroke-linejoin="round" fill="#13092D"/>
          <circle cx="16" cy="16" r="6.5" stroke="url(#vaultDial)" stroke-width="1.8" stroke-dasharray="2 2"/>
          <path d="M13 13.5L16 18.5L19 13.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="16" cy="16" r="1.8" fill="#38BDF8"/>
        </svg>
      `;
    }

    // Unified Resilient API Caller
    async function apiCall(endpoint, payload) {
      try {
        const isFile = window.location.protocol === 'file:';
        const baseUrl = isFile ? 'http://127.0.0.1:8000' : '';
        let url = endpoint.startsWith('http') ? endpoint : baseUrl + endpoint;
        
        let res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        // Auto-fallback: if /api/route 404s, attempt /route
        if (res.status === 404 && endpoint.startsWith('/api/')) {
          const fallbackUrl = baseUrl + endpoint.replace('/api/', '/');
          res = await fetch(fallbackUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        }
        
        return await res.json();
      } catch (err) {
        return { ok: false, msg: 'Network error or server down. Please try again.' };
      }
    }

    async function refreshUser() {
      if (!state.user) return;
      const accNo = state.user.accountNo || state.user['accountNo.'];
      const res = await apiCall('/api/login', { accountNo: accNo, pin: String(state.sessionPin) });
      if (res.ok) state.user = res.user;
    }

    function showToast(msg, isSuccess = true) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast-anim pointer-events-auto flex items-center gap-3 px-5 py-3.5 rounded-xl shadow-2xl text-sm font-semibold border ${
        isSuccess 
          ? 'bg-[#140C2E]/95 text-emerald-300 border-emerald-500/40 shadow-emerald-950/50' 
          : 'bg-[#1C0B1B]/95 text-rose-300 border-rose-500/40 shadow-rose-950/50'
      }`;
      toast.innerHTML = `
        <i class="fas ${isSuccess ? 'fa-circle-check text-emerald-400 text-base' : 'fa-triangle-exclamation text-rose-400 text-base'}"></i>
        <span>${esc(msg)}</span>
      `;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(15px)';
        toast.style.transition = 'all 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function closeModal() {
      const modal = document.getElementById('modal-container');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      modal.innerHTML = '';
    }

    function openModal(contentHtml) {
      const modal = document.getElementById('modal-container');
      modal.innerHTML = contentHtml;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    // =================================================================
    // FEATURE: QUICK BALANCE CHECK MODAL
    // =================================================================
    function promptCheckBalance() {
      openModal(`
        <div class="w-full max-w-md glass-card rounded-3xl p-6 sm:p-8 border border-purple-500/40 shadow-2xl relative space-y-6">
          <button onclick="closeModal()" class="absolute top-5 right-5 text-slate-400 hover:text-white p-2">
            <i class="fas fa-times text-lg"></i>
          </button>

          <div class="flex items-center gap-3 border-b border-purple-500/20 pb-4">
            <div class="w-12 h-12 rounded-2xl bg-cyan-500/20 border border-cyan-500/30 flex items-center justify-center text-cyan-400 text-xl">
              <i class="fas fa-magnifying-glass-dollar"></i>
            </div>
            <div>
              <h3 class="text-xl font-extrabold text-white">Check Account Balance</h3>
              <p class="text-xs text-purple-300">Instant secure inquiry with 4-digit PIN</p>
            </div>
          </div>

          <form id="checkBalanceForm" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Account Number or Email</label>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-purple-400"><i class="fas fa-id-card"></i></span>
                <input type="text" id="chk_acc" placeholder="Enter account number or email" required autocomplete="off"
                  class="w-full pl-10 pr-4 py-3 rounded-xl bg-[#0F0826] border border-purple-500/30 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-cyan-400">
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">4-Digit Security PIN</label>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-purple-400"><i class="fas fa-lock"></i></span>
                <input type="password" id="chk_pin" maxlength="4" placeholder="••••" required autocomplete="off"
                  class="w-full pl-10 pr-4 py-3 rounded-xl bg-[#0F0826] border border-purple-500/30 text-white placeholder-slate-500 text-lg font-mono tracking-widest focus:outline-none focus:border-cyan-400">
              </div>
            </div>

            <div id="balanceResultArea" class="hidden"></div>

            <button type="submit" id="chk_submit_btn" class="w-full py-3.5 bg-gradient-to-r from-cyan-600 via-indigo-600 to-purple-600 hover:from-cyan-500 hover:to-purple-500 text-white font-bold rounded-xl shadow-lg shadow-cyan-600/30 text-sm transition-all flex items-center justify-center gap-2">
              <i class="fas fa-bolt text-amber-300"></i>
              <span>Retrieve Live Balance</span>
            </button>
          </form>
        </div>
      `);

      const form = document.getElementById('checkBalanceForm');
      form.onsubmit = async (e) => {
        e.preventDefault();
        const acc = document.getElementById('chk_acc').value.trim();
        const pin = document.getElementById('chk_pin').value.trim();
        const btn = document.getElementById('chk_submit_btn');
        const resArea = document.getElementById('balanceResultArea');
        
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying Credentials...';

        const res = await apiCall('/api/balance', { accountNo: acc, pin: pin });
        if (res.ok) {
          resArea.classList.remove('hidden');
          resArea.innerHTML = `
            <div class="p-5 rounded-2xl bg-gradient-to-br from-purple-950/80 to-[#140A30] border border-cyan-500/40 space-y-3">
              <div class="flex justify-between items-start">
                <div>
                  <span class="text-[10px] font-bold text-cyan-300 uppercase tracking-wider block">Current Ledger Balance</span>
                  <div class="text-3xl font-extrabold text-white font-mono mt-0.5">
                    <span class="text-xl text-cyan-400 font-sans">₹</span>${Number(res.balance).toLocaleString('en-IN', {minimumFractionDigits: 2})}
                  </div>
                </div>
                <span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">Verified</span>
              </div>
              <div class="pt-2 border-t border-purple-500/20 text-xs text-slate-300 flex justify-between">
                <span>Holder: <strong class="text-white">${esc(res.name)}</strong></span>
                <span class="font-mono text-purple-300">A/C: ${esc(res.accountNo)}</span>
              </div>
            </div>
          `;
          btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Login to Full Dashboard';
          btn.onclick = () => {
            closeModal();
            state.user = res;
            state.sessionPin = pin;
            state.dashTab = 'dashboard';
            render();
          };
        } else {
          showToast(res.msg || "Authentication failed. Invalid Account or PIN.", false);
          btn.innerHTML = '<i class="fas fa-bolt text-amber-300"></i> <span>Retrieve Live Balance</span>';
        }
      };
    }

    // =================================================================
    // FEATURE: ACCOUNT CREATION SUCCESS MODAL
    // =================================================================
    function showAccountSuccessModal(user, pin) {
      const accNo = esc(user.accountNo || user['accountNo.']);
      openModal(`
        <div class="w-full max-w-md glass-card rounded-3xl p-6 sm:p-8 border border-emerald-500/40 shadow-2xl relative space-y-6 text-center">
          <div class="w-16 h-16 rounded-3xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 text-3xl mx-auto shadow-lg shadow-emerald-500/20">
            <i class="fas fa-award"></i>
          </div>

          <div class="space-y-1">
            <h3 class="text-2xl font-extrabold text-white">Account Created!</h3>
            <p class="text-xs text-purple-300">Your account has been officially registered in the VaultX ledger.</p>
          </div>

          <!-- Account Box with Copy Button -->
          <div class="p-5 rounded-2xl bg-[#0C0620] border-2 border-purple-500/40 space-y-3 text-left">
            <div>
              <span class="text-[10px] font-bold uppercase tracking-wider text-purple-400 block">Your Generated Account Number</span>
              <div class="flex items-center justify-between gap-2 mt-1">
                <span id="createdAccDisplay" class="text-2xl font-extrabold font-mono text-amber-300 tracking-wider">${accNo}</span>
                <button type="button" onclick="navigator.clipboard.writeText('${accNo}'); showToast('Account number copied to clipboard!', true);"
                  class="px-3 py-1.5 rounded-lg bg-purple-600/30 hover:bg-purple-600 text-purple-200 text-xs font-bold border border-purple-500/30 flex items-center gap-1.5 transition-colors">
                  <i class="fas fa-copy"></i> Copy
                </button>
              </div>
            </div>

            <div class="pt-3 border-t border-purple-500/20 grid grid-cols-2 gap-2 text-xs">
              <div>
                <span class="text-slate-400 block text-[10px]">Account Holder</span>
                <span class="font-bold text-white">${esc(user.name)}</span>
              </div>
              <div class="text-right">
                <span class="text-slate-400 block text-[10px]">Starting Balance</span>
                <span class="font-bold text-emerald-400 font-mono">₹${Number(user.balance || 0).toLocaleString()}</span>
              </div>
            </div>
          </div>

          <p class="text-[11px] text-amber-300/80 bg-amber-500/10 p-2.5 rounded-xl border border-amber-500/20">
            <i class="fas fa-circle-exclamation mr-1"></i> Please note down your Account Number and PIN to access your account.
          </p>

          <button onclick="closeModal(); state.user = ${JSON.stringify(user).replace(/"/g, '&quot;')}; state.sessionPin = '${pin}'; state.dashTab = 'dashboard'; render();"
            class="w-full py-4 bg-gradient-to-r from-purple-600 via-indigo-600 to-purple-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold rounded-xl shadow-lg shadow-purple-600/30 text-sm transition-all hover:scale-[1.01]">
            <span>Proceed to Account Dashboard</span>
            <i class="fas fa-arrow-right ml-1"></i>
          </button>
        </div>
      `);
    }

    // =================================================================
    // 1. LANDING PAGE VIEW
    // =================================================================
    function landingPageHTML() {
      return `
        <!-- Top Navbar -->
        <nav class="w-full bg-[#0C0721]/90 backdrop-blur-md border-b border-purple-500/15 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-[#150B32] border border-purple-500/30 flex items-center justify-center text-white shadow-lg shadow-purple-600/20">
              ${getVaultXLogo("w-7 h-7")}
            </div>
            <div>
              <div class="flex items-center gap-2">
                <span class="text-xl font-extrabold tracking-tight text-white">Vault<span class="text-purple-400">X</span></span>
                <span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-purple-500/20 text-purple-300 border border-purple-500/30">Python OOP</span>
              </div>
              <p class="text-[11px] text-slate-400 font-medium">Bank Management System</p>
            </div>
          </div>

          <div class="flex items-center gap-2 sm:gap-3">
            <!-- Dedicated Check Balance Button in Navbar -->
            <button onclick="promptCheckBalance()" class="px-3.5 py-2 text-xs sm:text-sm text-cyan-300 font-bold rounded-xl bg-cyan-950/40 border border-cyan-500/30 hover:bg-cyan-900/30 transition-all flex items-center gap-1.5 shadow-sm">
              <i class="fas fa-magnifying-glass-dollar text-cyan-400"></i>
              <span>Check Balance</span>
            </button>

            <button data-tab="login" class="px-3.5 py-2 text-xs sm:text-sm text-slate-300 font-semibold hover:text-white transition-colors">Sign In</button>
            <button data-tab="create" class="px-4 py-2 sm:px-5 sm:py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white text-xs sm:text-sm font-bold rounded-xl shadow-lg shadow-purple-600/30 transition-all hover:scale-[1.02] active:scale-95">
              Open Account
            </button>
          </div>
        </nav>

        <!-- Hero & Learning Showcase -->
        <div class="flex-1 flex flex-col relative overflow-hidden">
          <div class="glow-purple absolute -top-40 -left-40 w-[600px] h-[600px] pointer-events-none"></div>
          <div class="glow-cyan absolute top-1/3 -right-40 w-[500px] h-[500px] pointer-events-none"></div>

          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 lg:py-14 w-full">
            
            <!-- Learning Badge Banner -->
            <div class="inline-flex items-center gap-2.5 px-4 py-1.5 rounded-full bg-purple-900/40 border border-purple-500/30 text-purple-300 text-xs sm:text-sm font-semibold mb-6 shadow-inner">
              <span class="flex h-2 w-2 relative">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-purple-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-purple-500"></span>
              </span>
              <span>🚀 Started My First Python Management Project</span>
              <span class="text-purple-400/50">|</span>
              <span class="text-amber-400 font-bold">100 Days of Code</span>
            </div>

            <!-- Headline -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 items-center">
              <div class="lg:col-span-7 space-y-6">
                <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold text-white tracking-tight leading-[1.15]">
                  Building a Real-World <br>
                  <span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-400 to-cyan-400">
                    Bank Management System
                  </span><br>
                  with Python & OOP.
                </h1>
                
                <p class="text-slate-300 text-base sm:text-lg leading-relaxed max-w-2xl font-normal">
                  "Today, I began building a real-world application using OOP concepts. Learning isn't just about writing code—it's about creating something useful, one step at a time! 💜"
                </p>

                <!-- Action CTA -->
                <div class="flex flex-wrap items-center gap-4 pt-2">
                  <button data-tab="create" class="px-7 py-3.5 bg-gradient-to-r from-purple-600 via-indigo-600 to-purple-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold rounded-xl shadow-xl shadow-purple-600/30 transition-all hover:scale-[1.02] active:scale-95 flex items-center gap-2 text-base">
                    <span>Create Account Now</span>
                    <i class="fas fa-user-plus text-sm"></i>
                  </button>

                  <button onclick="promptCheckBalance()" class="px-6 py-3.5 rounded-xl bg-cyan-950/50 border border-cyan-500/40 text-cyan-200 font-bold text-base hover:bg-cyan-900/40 transition-all flex items-center gap-2 shadow-lg shadow-cyan-950/40">
                    <i class="fas fa-magnifying-glass-dollar text-cyan-400"></i>
                    <span>Check Balance</span>
                  </button>

                  <button data-tab="login" class="px-6 py-3.5 glass-card glass-card-hover text-purple-200 font-semibold rounded-xl text-base flex items-center gap-2">
                    <span>Sign In</span>
                    <i class="fas fa-arrow-right-to-bracket text-sm"></i>
                  </button>
                </div>
              </div>

              <!-- VS Code IDE Showcase -->
              <div class="lg:col-span-5">
                <div class="ide-window overflow-hidden">
                  <div class="bg-[#140C2E] px-4 py-3 flex items-center justify-between border-b border-purple-500/20">
                    <div class="flex items-center gap-2">
                      <span class="w-3 h-3 rounded-full bg-rose-500/80 inline-block"></span>
                      <span class="w-3 h-3 rounded-full bg-amber-500/80 inline-block"></span>
                      <span class="w-3 h-3 rounded-full bg-emerald-500/80 inline-block"></span>
                      <span class="ml-2 text-xs font-mono text-purple-300 font-medium flex items-center gap-1.5">
                        <i class="fab fa-python text-amber-400"></i> bank_system.py
                      </span>
                    </div>
                    <span class="text-[10px] font-mono text-slate-400">OOP Architecture</span>
                  </div>

                  <div class="p-4 sm:p-5 font-mono text-xs sm:text-sm text-slate-300 leading-relaxed overflow-x-auto space-y-1">
                    <div class="text-purple-400 font-semibold">class <span class="text-cyan-300">Bank</span>:</div>
                    <div class="pl-4 text-purple-300 font-medium">def <span class="text-amber-300">create_account</span>(self, name, age, mail, pin, phone):</div>
                    <div class="pl-8 text-slate-400"># Age Validation Rule (18+)</div>
                    <div class="pl-8 text-rose-300">if age &lt; 18:</div>
                    <div class="pl-12 text-slate-300"><span class="text-purple-400">raise</span> ValidationError(<span class="text-emerald-300">"Must be 18+ to open account"</span>)</div>

        `;
      }

      // TAB: CARDS
      if (state.dashTab === 'cards') {
        const cardNum = user.card_number ? user.card_number.match(/.{1,4}/g).join(' ') : '4532 9912 8841 0092';
        return `
          <div class="max-w-2xl mx-auto space-y-6">
            <div class="bank-card-gradient rounded-3xl p-8 text-white relative overflow-hidden flex flex-col justify-between min-h-[220px]">
              <div class="flex justify-between items-start">
                <div class="text-lg font-extrabold tracking-widest text-purple-300">Vault<span class="text-white">X</span> PLATINUM</div>
                <i class="fas fa-wifi text-lg text-purple-300"></i>
              </div>

              <div class="my-6">
                <div class="font-mono text-xl sm:text-2xl tracking-[0.2em] font-bold text-purple-100">${cardNum}</div>
              </div>

              <div class="flex justify-between items-end text-xs uppercase font-semibold text-purple-300">
                <div>
                  <span class="text-[9px] block text-purple-400">Cardholder</span>
                  <span class="text-sm font-bold text-white">${name}</span>
                </div>
                <div class="text-right">
                  <span class="text-[9px] block text-purple-400">Expires</span>
                  <span class="text-sm font-bold text-white">${user.expiry || '12/28'}</span>
                </div>
              </div>
            </div>

            <div class="glass-card rounded-2xl p-6 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div>
                <h4 class="font-bold text-white text-sm">Need a Replacement Card?</h4>
                <p class="text-xs text-slate-400">Generate a fresh virtual number & CVV instantly.</p>
              </div>
              <button onclick="requestNewCard()" class="px-5 py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold text-xs rounded-xl shadow-lg transition-transform hover:scale-105 active:scale-95">
                <i class="fas fa-rotate mr-1"></i> Generate New Card
              </button>
            </div>
          </div>
        `;
      }

      // TAB: SETTINGS
      if (state.dashTab === 'settings') {
        return `
          <div class="max-w-xl mx-auto space-y-8">
            <div class="glass-card rounded-3xl p-6 sm:p-8 border border-purple-500/25 space-y-6">
              <div class="flex items-center gap-3 border-b border-purple-500/15 pb-4">
                <div class="w-10 h-10 rounded-xl bg-purple-600/20 text-purple-300 flex items-center justify-center font-bold">
                  <i class="fas fa-user-pen"></i>
                </div>
                <div>
                  <h3 class="text-lg font-bold text-white">Modify Account Details</h3>
                  <p class="text-xs text-slate-400">Update contact info or set a new 4-digit PIN</p>
                </div>
              </div>

              <form id="updateForm" class="space-y-4">
                <div>
                  <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Full Name</label>
                  <input type="text" id="up_name" placeholder="Enter updated full name" value="${name}"
                    class="w-full px-4 py-2.5 rounded-xl bg-[#0F0826] border border-purple-500/25 text-white text-sm focus:outline-none focus:border-purple-400">
                </div>

                <div>
                  <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Email Address</label>
                  <input type="email" id="up_email" placeholder="Enter updated email" value="${esc(user.email)}"
                    class="w-full px-4 py-2.5 rounded-xl bg-[#0F0826] border border-purple-500/25 text-white text-sm focus:outline-none focus:border-purple-400">
                </div>

                <div>
                  <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Set New 4-Digit PIN</label>
                  <input type="password" id="up_pin" maxlength="4" placeholder="•••• (leave blank to keep current)"
                    class="w-full px-4 py-2.5 rounded-xl bg-[#0F0826] border border-purple-500/25 text-white text-lg font-mono tracking-widest focus:outline-none focus:border-purple-400">
                </div>

                <button type="submit" class="w-full py-3 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-xl text-sm transition-all shadow-lg shadow-purple-600/30">
                  Save Changes
                </button>
              </form>
            </div>

            <!-- Danger Zone -->
            <div class="p-6 rounded-3xl bg-rose-950/20 border border-rose-500/25 space-y-4">
              <div class="flex items-center gap-3">
                <i class="fas fa-triangle-exclamation text-rose-400 text-xl"></i>
                <div>
                  <h4 class="font-bold text-rose-300 text-sm">Account Termination</h4>
                  <p class="text-xs text-slate-400">Permanently close this account and erase records.</p>
                </div>
              </div>
              <button id="deleteBtn" class="w-full py-3 bg-rose-600/20 hover:bg-rose-600 border border-rose-500/40 text-rose-300 hover:text-white font-bold rounded-xl text-sm transition-all">
                Close & Delete Account
              </button>
            </div>
          </div>
        `;
      }

      return '';
    }

    // =================================================================
    // 4. EVENT WIRE-UP ENGINE
    // =================================================================
    function wireEvents() {
      const user = state.user;

      // Tab switcher across landing/auth
      document.querySelectorAll('[data-tab]').forEach(btn => {
        btn.onclick = (e) => {
          e.preventDefault();
          state.authTab = btn.dataset.tab;
          render();
        };
      });

      // Unauthenticated actions (Login & Register)
      if (!user) {
        const loginForm = document.getElementById('loginForm');
        if (loginForm) {
          loginForm.onsubmit = async (e) => {
            e.preventDefault();
            const btn = loginForm.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';

            const acc = document.getElementById('li_acc').value.trim();
            const pinRaw = document.getElementById('li_pin').value.trim();

            if (!acc || !pinRaw) {
              showToast("Please enter Account Number/Email and PIN.", false);
              btn.innerHTML = originalText;
              return;
            }

            const res = await apiCall('/api/login', { accountNo: acc, pin: pinRaw });
            if (res.ok) {
              state.user = res.user;
              state.sessionPin = String(pinRaw);
              state.dashTab = 'dashboard';
              showToast("Authentication successful! Welcome back.", true);
            } else {
              showToast(res.msg || "Invalid credentials.", false);
              btn.innerHTML = originalText;
            }
            render();
          };
        }

        const createForm = document.getElementById('createForm');
        if (createForm) {
          createForm.onsubmit = async (e) => {
            e.preventDefault();
            const btn = createForm.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Registering Account...';

            const name = document.getElementById('cr_name').value.trim();
            const age = Number(document.getElementById('cr_age').value);
            const email = document.getElementById('cr_email').value.trim();
            const phone = document.getElementById('cr_phone') ? document.getElementById('cr_phone').value.trim() : '';
            const accType = document.getElementById('cr_acctype') ? document.getElementById('cr_acctype').value : 'Savings';
            const pin = document.getElementById('cr_pin').value.trim();

            if (age < 18) {
              showToast("Account creation denied: You must be at least 18 years old.", false);
              btn.innerHTML = originalText;
              return;
            }

            if (pin.length !== 4 || !/^\d{4}$/.test(pin)) {
              showToast("PIN error: PIN must be strictly a 4-digit number.", false);
              btn.innerHTML = originalText;
              return;
            }

            const res = await apiCall('/api/create', { name, age, email, phone, accType, pin });
            if (res.ok) {
              // Open Dedicated Success Modal showing the new account number clearly
              showAccountSuccessModal(res.user, pin);
            } else {
              showToast(res.msg || "Account creation failed.", false);
              btn.innerHTML = originalText;
            }
          };
        }
        return;
      }

      // Authenticated Dashboard Actions
      const logoutBtn = document.getElementById('logoutLink');
      const mobileLogoutBtn = document.getElementById('mobileLogout');
      const doLogout = () => {
        state.user = null;
        state.sessionPin = null;
        state.authTab = 'landing';
        showToast("Signed out securely.", true);
        render();
      };
      if (logoutBtn) logoutBtn.onclick = doLogout;
      if (mobileLogoutBtn) mobileLogoutBtn.onclick = doLogout;

      // Dashboard navigation tabs
      document.querySelectorAll('[data-dtab]').forEach(btn => {
        btn.onclick = () => {
          state.dashTab = btn.dataset.dtab;
          render();
        };
      });

      // 1. Deposit Form
      const depositForm = document.getElementById('depositForm');
      if (depositForm) {
        depositForm.onsubmit = async (e) => {
          e.preventDefault();
          const amt = Number(document.getElementById('dep_amt').value);
          const accNo = user.accountNo || user['accountNo.'];
          const res = await apiCall('/api/deposit', { accountNo: accNo, pin: state.sessionPin, amount: amt });
          if (res.ok) {
            showToast(`Deposited ₹${amt.toLocaleString()} successfully!`, true);
            await refreshUser();
            state.dashTab = 'dashboard';
          } else {
            showToast(res.msg || "Deposit failed.", false);
          }
          render();
        };
      }

      // 2. Withdraw Form
      const withdrawForm = document.getElementById('withdrawForm');
      if (withdrawForm) {
        withdrawForm.onsubmit = async (e) => {
          e.preventDefault();
          const amt = Number(document.getElementById('wd_amt').value);
          const accNo = user.accountNo || user['accountNo.'];
          const res = await apiCall('/api/withdraw', { accountNo: accNo, pin: state.sessionPin, amount: amt });
          if (res.ok) {
            showToast(`Withdrew ₹${amt.toLocaleString()} successfully!`, true);
            await refreshUser();
            state.dashTab = 'dashboard';
          } else {
            showToast(res.msg || "Withdrawal failed.", false);
          }
          render();
        };
      }

      // 3. Transfer Form
      const transferForm = document.getElementById('transferForm');
      if (transferForm) {
        transferForm.onsubmit = async (e) => {
          e.preventDefault();
          const target = document.getElementById('tr_target').value.trim();
          const amt = Number(document.getElementById('tr_amt').value);
          const accNo = user.accountNo || user['accountNo.'];
          const res = await apiCall('/api/transfer', { accountNo: accNo, pin: state.sessionPin, targetAccount: target, amount: amt });
          if (res.ok) {
            showToast(`Transferred ₹${amt.toLocaleString()} to ${target}!`, true);
            await refreshUser();
            state.dashTab = 'dashboard';
          } else {
            showToast(res.msg || "Transfer failed.", false);
          }
          render();
        };
      }

      // 4. Update Profile Form
      const updateForm = document.getElementById('updateForm');
      if (updateForm) {
        updateForm.onsubmit = async (e) => {
          e.preventDefault();
          const name = document.getElementById('up_name').value.trim();
          const email = document.getElementById('up_email').value.trim();
          const pin = document.getElementById('up_pin').value.trim();
          const accNo = user.accountNo || user['accountNo.'];

          const res = await apiCall('/api/update', {
            accountNo: accNo,
            pin: state.sessionPin,
            name: name || null,
            email: email || null,
            newPin: pin || null
          });

          if (res.ok) {
            if (res.newPin) state.sessionPin = String(res.newPin);
            await refreshUser();
            showToast("Profile details updated successfully!", true);
          } else {
            showToast(res.msg || "Update failed.", false);
          }
          render();
        };
      }

      // 5. Delete Account
      const deleteBtn = document.getElementById('deleteBtn');
      if (deleteBtn) {
        deleteBtn.onclick = async () => {
          if (confirm("Are you completely sure you want to close this account? This action is permanent.")) {
            const accNo = user.accountNo || user['accountNo.'];
            const res = await apiCall('/api/delete', { accountNo: accNo, pin: state.sessionPin });
            if (res.ok) {
              state.user = null;
              state.sessionPin = null;
              state.authTab = 'landing';
              showToast("Account deleted permanently.", true);
            } else {
              showToast(res.msg || "Deletion failed.", false);
            }
            render();
          }
        };
      }
    }

    async function requestNewCard() {
      if (!state.user) return;
      const accNo = state.user.accountNo || state.user['accountNo.'];
      const res = await apiCall('/api/new_card', { accountNo: accNo, pin: String(state.sessionPin) });
      showToast(res.msg || "New card generated!", res.ok);
      if (res.ok) {
        await refreshUser();
        render();
      }
    }
    window.requestNewCard = requestNewCard;

    // Boot App
    render();
  </script>

  <!-- Floating Chat Widget (Gemini AI Assistant) -->
  <div id="chat-widget" class="fixed bottom-6 right-6 z-[100] flex flex-col items-end">
    <!-- Chat Window -->
    <div id="chat-window" class="hidden w-80 sm:w-96 bg-[#0E0822]/95 backdrop-blur-2xl border border-purple-500/30 rounded-3xl shadow-2xl mb-4 overflow-hidden flex-col h-[480px] max-h-[80vh]">
      <div class="bg-gradient-to-r from-purple-700 to-indigo-700 text-white p-4 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-xl bg-purple-500/30 flex items-center justify-center text-white">
            <i class="fas fa-robot text-sm"></i>
          </div>
          <div>
            <h4 class="font-bold text-sm">VaultX AI Assistant</h4>
            <p class="text-[10px] text-purple-200">Powered by Gemini & Python</p>
          </div>
        </div>
        <button onclick="toggleChat()" class="text-purple-200 hover:text-white p-1">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 text-xs sm:text-sm">
        <div class="flex justify-start">
          <div class="bg-purple-950/60 border border-purple-500/20 text-purple-200 p-3 rounded-2xl rounded-tl-sm max-w-[85%]">
            Hello! I am your VaultX Assistant. Ask me anything about banking rules, checking balances, or your account!
          </div>
        </div>
      </div>

      <div class="p-3 bg-[#0A051A] border-t border-purple-500/20">
        <form id="chat-form" class="relative flex items-center">
          <input type="text" id="chat-input" placeholder="Ask a question..." autocomplete="off" required
            class="w-full pl-3.5 pr-10 py-2.5 rounded-xl bg-[#140C2E] border border-purple-500/30 text-white placeholder-slate-500 text-xs focus:outline-none focus:border-purple-400">
          <button type="submit" class="absolute right-1.5 w-7 h-7 rounded-lg bg-purple-600 hover:bg-purple-500 text-white flex items-center justify-center text-xs transition-colors">
            <i class="fas fa-paper-plane"></i>
          </button>
        </form>
      </div>
    </div>

    <!-- Toggle Button -->
    <button id="chat-toggle" onclick="toggleChat()" class="w-13 h-13 p-3.5 rounded-full bg-gradient-to-tr from-purple-600 to-indigo-500 hover:from-purple-500 hover:to-indigo-400 text-white shadow-xl shadow-purple-600/40 transition-transform hover:scale-110 active:scale-95 flex items-center justify-center">
      <i class="fas fa-robot text-xl"></i>
    </button>
  </div>

  <script>
    function toggleChat() {
      const w = document.getElementById('chat-window');
      w.classList.toggle('hidden');
      w.classList.toggle('flex');
    }

    document.addEventListener('DOMContentLoaded', () => {
      const chatForm = document.getElementById('chat-form');
      if (chatForm) {
        chatForm.onsubmit = async (e) => {
          e.preventDefault();
          const input = document.getElementById('chat-input');
          const msg = input.value.trim();
          if (!msg) return;

          input.value = '';
          const messagesArea = document.getElementById('chat-messages');

          messagesArea.innerHTML += `
            <div class="flex justify-end">
              <div class="bg-purple-600 text-white p-3 rounded-2xl rounded-tr-sm max-w-[85%] text-xs">
                ${esc(msg)}
              </div>
            </div>
          `;
          messagesArea.scrollTop = messagesArea.scrollHeight;

          const loadId = 'loading-' + Date.now();
          messagesArea.innerHTML += `
            <div id="${loadId}" class="flex justify-start">
              <div class="bg-purple-950/60 border border-purple-500/20 text-purple-300 p-2.5 rounded-2xl rounded-tl-sm text-xs flex items-center gap-2">
                <i class="fas fa-circle-notch fa-spin"></i> Thinking...
              </div>
            </div>
          `;
          messagesArea.scrollTop = messagesArea.scrollHeight;

          try {
            const data = await apiCall('/api/chat', { message: msg });
            const loader = document.getElementById(loadId);
            if (loader) loader.remove();

            messagesArea.innerHTML += `
              <div class="flex justify-start">
                <div class="bg-purple-950/60 border border-purple-500/20 text-purple-200 p-3 rounded-2xl rounded-tl-sm max-w-[85%] text-xs whitespace-pre-wrap">
                  ${data.reply ? esc(data.reply) : "Could not reach AI."}
                </div>
              </div>
            `;
          } catch(err) {
            const loader = document.getElementById(loadId);
            if (loader) loader.remove();
            messagesArea.innerHTML += `
              <div class="flex justify-start">
                <div class="bg-rose-950/60 border border-rose-500/20 text-rose-300 p-3 rounded-2xl rounded-tl-sm text-xs">
                  Error connecting to assistant.
                </div>
              </div>
            `;
          }
          messagesArea.scrollTop = messagesArea.scrollHeight;
        };
      }
    });
  </script>

</body>
